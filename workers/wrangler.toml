name = "conecta-umadalpe-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---- D1 Database ----

# Crie com: npx wrangler d1 create conecta-umadalpe-db

[[d1_databases]]
binding = "DB"
database_name = "conecta-umadalpe-db"
database_id = "65ccfef7-2d3f-4bc2-9ab3-82879ad9de46"

# ---- KV Namespace (contadores simples / cache) ----

[[kv_namespaces]]
binding = "CACHE"
id = "d8a8f7c07f7a4f81bb54c92b2e1036c3"

# ---- Durable Objects (tempo real: contadores + mosaico + SSE) ----

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeRoom"]

# ---- Variáveis de ambiente ----

[vars]
CORS_ORIGIN = "*"

# Rate limiting básico é feito via KV (ver src/middleware/rateLimit.ts)